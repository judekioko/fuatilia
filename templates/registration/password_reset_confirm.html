{% extends "base.html" %}
{% block title %}Choose a new password{% endblock %}
{% block content %}
<div class="card narrow-sm">
  {% if validlink %}
    <h1>Choose a new password</h1>
    <form method="post" novalidate>{% csrf_token %}{% include "_form.html" %}
      <button class="btn btn-primary btn-block" type="submit">Save new password</button>
    </form>
  {% else %}
    <h1>Link expired</h1>
    <p>This reset link is no longer valid. <a href="{% url 'password_reset' %}">Request a new one</a>.</p>
  {% endif %}
</div>
{% endblock %}
