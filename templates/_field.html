{% if field.is_hidden %}{{ field }}{% else %}
<div class="field">
  {% if field.widget_type == "checkbox" %}
    <label class="checkbox">{{ field }} <span>{{ field.label }}</span></label>
  {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if not field.field.required %} <small>(optional)</small>{% endif %}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<div class="help">{{ field.help_text|safe }}</div>{% endif %}
  {{ field.errors }}
</div>{% endif %}
